# Synthetic IDs/paths: replace explicitly. Never place secret values in TOML.
[server]
listen = "127.0.0.1:8765"
# Optional: choose an environment source OR an owned mode-0600 file.
# auth_token_env = "TELEGRAM_MCP_AUTH_TOKEN"
# auth_token_file = "~/.config/telegram-mcp-relay/bearer.token"
# create_auth_token_file = true # requires an existing private parent directory

[telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id = 101
allowed_chat_ids = [101]
allowed_user_ids = [202]
# Alternatively remove bot_token_env and use bot_token_file.

[files]
allowed_roots = ["/home/synthetic/agent-exports"]
max_outbound_mb = 50

[delivery]
wait_fallback_enabled = true
wait_timeout_seconds = 600
processing_start_grace_seconds = 60

[activity]
typing_enabled = true
typing_refresh_seconds = 4
typing_max_duration_seconds = 600

[storage]
path = "~/.local/state/telegram-mcp-relay/relay.sqlite"
session_ttl_days = 30
route_ttl_days = 30
reply_ttl_days = 30
cleanup_interval_hours = 24

[history]
# Incoming capture is supported; outgoing capture/read tools land separately. Bodies are private data.
# Enabling requires server.auth_token_env or server.auth_token_file and a resolved bearer.
enabled = false
retention_days = 30
max_records = 10000
max_attachments = 10000
max_record_bytes = 65536
max_body_bytes = 8388608
max_metadata_bytes = 4194304

# Other bounded settings retain the defaults declared in src/config.rs.
