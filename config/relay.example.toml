# Synthetic IDs/paths: replace explicitly. Never place secret values in TOML.
[server]
listen = "127.0.0.1:8765"
# Optional: choose an environment source OR an owned mode-0600 file.
# auth_token_env = "TELEGRAM_MCP_AUTH_TOKEN"
# auth_token_file = "~/.config/telegram-mcp-relay/bearer.token"
# create_auth_token_file = true # requires an existing private parent directory

[telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id = 101
allowed_chat_ids = [101]
allowed_user_ids = [202]
# Alternatively remove bot_token_env and use bot_token_file.
# Optional operator-managed same-host Bot API started with --local:
# bot_api = "local"
# local_bot_api_url = "http://127.0.0.1:8081"
# local_bot_api_files_root = "/home/synthetic/telegram-bot-api"

[files]
allowed_roots = ["/home/synthetic/agent-exports"]
max_outbound_mb = 50

[downloads]
# telegram_get_attachment uses private owned storage; downloads default off.
# Enable only with existing owned mode-0700 roots, separate from exports and secrets.
enabled = false
roots = []
max_file_bytes = 20000000
max_total_bytes = 100000000
max_files = 64
concurrent = 2
timeout_seconds = 600
# For 1 GiB downloads in local mode, replace the corresponding values above:
# enabled = true
# roots = ["~/.local/state/telegram-mcp-relay/downloads"]
# max_file_bytes = 1073741824
# max_total_bytes = 4294967296
# timeout_seconds = 3600
retention_seconds = 3600
cleanup_interval_seconds = 60
min_free_bytes = 16777216

[delivery]
wait_fallback_enabled = true
wait_timeout_seconds = 600
processing_start_grace_seconds = 60
# "message" restores the threaded text instead of the 👀 start reaction.
processing_start_ack = "reaction"

[activity]
typing_enabled = true
typing_refresh_seconds = 4
typing_max_duration_seconds = 600

[storage]
path = "~/.local/state/telegram-mcp-relay/relay.sqlite"
session_ttl_days = 30
route_ttl_days = 30
reply_ttl_days = 30
cleanup_interval_hours = 24

[history]
# Opt-in incoming and confirmed outgoing/service capture plus shared reads. Bodies are private data.
# Enabling requires server.auth_token_env or server.auth_token_file and a resolved bearer.
enabled = false
retention_days = 30
max_records = 10000
max_attachments = 10000
max_record_bytes = 65536
max_body_bytes = 8388608
max_metadata_bytes = 4194304

# Other bounded settings retain the defaults declared in src/config.rs.
