[package]
name = "telegram-mcp-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
description = "A shared local MCP relay for Telegram agent sessions"

[dependencies]
getrandom = { version = "0.4.3", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
unicode-segmentation = { version = "1.13.3", default-features = false }

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "net", "sync", "test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
